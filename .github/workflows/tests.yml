on:
  pull_request:
    paths-ignore: &paths_ignore
      - '.agents/**'
      - 'docs/**'
      - '.gitignore'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'README.md'

  push:
    paths-ignore: *paths_ignore

name: Tests

jobs:
  tests:
    name: Microservice generation and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate generator script syntax
        run: make syntax

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Build the microservice
        run: make build

      - name: Run tests
        run: make test
