on:
  pull_request:
    paths-ignore: &paths_ignore
      - '.agents/**'
      - 'docs/**'
      - '.gitignore'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'README.md'

  push:
    paths-ignore: *paths_ignore

name: Tests

jobs:
  tests:
    name: Microservice generation and tests
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate generator script syntax
        run: make syntax

      - name: Determine host user and group
        run: |
          echo "HOST_USER=$(id -un)" >> $GITHUB_ENV
          echo "HOST_GROUP=$(id -gn)" >> $GITHUB_ENV
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV

      - name: Store Docker builder cache
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            HOST_USER=${{ env.HOST_USER }}
            HOST_GROUP=${{ env.HOST_GROUP }}
            HOST_UID=${{ env.HOST_UID }}
            HOST_GID=${{ env.HOST_GID }}
          push: false
          tags: symfony-boilerplate-cache:latest
          load: true
          # cache between workflow runs:
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Build the microservice
        run: make build

      - name: Run tests
        run: make test
